name: Update results

# Refresh results + standings a few times a day, within the window when matches
# finish (CEST 18:00 → ~08:00). Cron is in UTC (CEST = UTC+2).
on:
  schedule:
    - cron: '0 21 * * *'   # 23:00 CEST — evening matches done
    - cron: '0 1 * * *'    # 03:00 CEST — late-night matches
    - cron: '0 7 * * *'    # 09:00 CEST — guarantees the full matchday
  workflow_dispatch: {}     # manual "Run workflow" button

permissions:
  contents: write           # allow the job to commit updated data

concurrency:
  group: update-results
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch results from Wikipedia
        run: python scripts/fetch_results.py

      - name: Commit data if it changed
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/results.js data/results.json
            git commit -m "chore: update results ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          else
            echo "No data changes."
          fi
