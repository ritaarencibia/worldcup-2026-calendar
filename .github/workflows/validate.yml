name: Validate

# Offline checks for the app logic and the data files. These run no network —
# the Norsk Tipping TLS proxy blocks local HTTPS, so validation belongs in CI.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Knockout slot mapping (32 boxes -> match numbers)
        run: python scripts/verify_knockout_mapping.py

      - name: Filtering & live/cut logic
        run: |
          node scripts/verify_app_logic.js
          node scripts/verify_live_and_cut.js

      - name: App renders against the real data (schedule, standings)
        run: node scripts/smoke_dom.js

      - name: Bracket tree topology & winner derivation
        run: node scripts/verify_bracket.js

      - name: Bracket renders against the real data
        run: node scripts/smoke_bracket_dom.js
